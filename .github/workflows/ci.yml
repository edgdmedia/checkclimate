name: CI

# Every push and pull request to `dev`: the checks that must pass before a
# change is merged. This workflow never deploys and never talks to Cloudflare
# or Neon, so it needs no secrets.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # `astro build` also compiles the Worker bundle, which is where a bad
      # binding reference or an unsupported Node API shows up.
      - name: Build
        run: pnpm build
        env:
          # The build bakes the public origin into the sitemap, feeds and
          # canonical URLs. Same value as production; not a secret.
          EMDASH_SITE_URL: https://www.checkclimate.africa

      - name: Check the Worker bundle
        run: pnpm exec wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
