name: CI

# Every push to `dev` or `vps` and every pull request: the checks that must
# pass before a change is merged. This workflow never deploys and needs no
# secrets. Deploying is deploy.yml, on pushes to `main`.

on:
  push:
    branches: [dev, vps]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The same standalone Node build the box runs (scripts/deploy-vps.sh),
      # with local media storage so it needs no R2 credentials.
      - name: Build for the box
        run: pnpm build:vps
        env:
          # The build bakes the public origin into the sitemap, feeds and
          # canonical URLs, and refuses localhost. Not a secret.
          EMDASH_SITE_URL: https://checkclimate.africa
          DATABASE_PATH: /home/checkclimate/data/emdash.db
          SESSION_DIR: /home/checkclimate/data/sessions
          EMDASH_STORAGE: local
