# nginx — the Check Climate Africa Node app, behind Cloudflare.
#
# Install as /etc/nginx/conf.d/checkclimate-node.conf, a file of our own. If
# Virtualmin creates a vhost for the checkclimate site, leave that file alone:
# conf.d/ is included at http{} level before sites-enabled/, so this block is
# defined first and wins (nginx -t then warns "conflicting server name ...
# ignored" for Virtualmin's: expected).
#
# Serves checkclimate.africa only. www never reaches the origin: a Cloudflare
# Redirect Rule sends it to the apex (301) at the edge. There is no staging
# host; the site goes straight to the apex. mail. and webmail. stay with
# Virtualmin's own vhosts.
#
# The listen lines name the server's address: every vhost on this box listens
# on 169.58.2.239, and nginx picks a server block by address first, so a bare
# `listen 443` would never be chosen for it.
#
# Test before reloading:  nginx -t && systemctl reload nginx

# Only Cloudflare may reach the origin. This is decided on the CONNECTING
# address ($realip_remote_addr), not $remote_addr: the realip settings below
# replace $remote_addr with the visitor's IP from CF-Connecting-IP, so an
# allow/deny on $remote_addr would see the visitor and refuse everyone.
# Ranges from https://www.cloudflare.com/ips/ (deploy/cloudflare-ips.txt).
geo $realip_remote_addr $checkclimate_from_cloudflare {
    default 0;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    108.162.192.0/18 1;
    131.0.72.0/22 1;
    141.101.64.0/18 1;
    162.158.0.0/15 1;
    172.64.0.0/13 1;
    173.245.48.0/20 1;
    188.114.96.0/20 1;
    190.93.240.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    # Both ports, so it works whatever the zone's SSL mode is (Flexible
    # connects on 80, Full / Full (strict) on 443).
    listen 169.58.2.239:80;
    listen 169.58.2.239:443 ssl;
    server_name checkclimate.africa;

    # Cloudflare Origin Certificate (SSL/TLS → Origin Server), for
    # checkclimate.africa and *.checkclimate.africa.
    ssl_certificate     /etc/ssl/checkclimate/origin.pem;
    ssl_certificate_key /etc/ssl/checkclimate/origin.key;

    # The visitor's IP, for the logs and the app.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    if ($checkclimate_from_cloudflare = 0) {
        return 403;
    }

    # Claim attachments are capped at 8 MB in the app. The content copy (Task 16)
    # is done on the laptop and the database file copied in, never uploaded here.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:4331;
        proxy_http_version 1.1;
        # The site builds its own URLs from the Host header.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Passed through as sent by Cloudflare; trustworthy only because of
        # the Cloudflare-only check above (trustedProxyHeaders in astro.config.mjs).
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
